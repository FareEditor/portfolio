<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // INTEGRATION: чтение выбора языка — localStorage / маршрут (/ vs /ru/)
      // Redirect first-time Russian-language visitors before first paint.
      // Bots don't run this, so both documents stay indexable.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('lang'); } catch (e) {}
        if (!stored && navigator.language && navigator.language.indexOf('ru') === 0) {
          location.replace('/ru/' + location.search + location.hash);
        }
      })();
    </script>
    <script>
      document.documentElement.classList.add('js-reveal');
      // Страховка: если бандл так и не загрузился (блокировщик, сеть, 404),
      // снимаем js-reveal — пререндеренный контент показывается без анимации.
      setTimeout(function () {
        if (!document.documentElement.hasAttribute('data-hydrated')) {
          document.documentElement.classList.remove('js-reveal');
        }
      }, 2500);
    </script>
    <link rel="preload" href="/src/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
