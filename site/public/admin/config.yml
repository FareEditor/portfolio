# Decap CMS — GitLab backend, PKCE (без своего OAuth-сервера).
# Авторизация — только GitLab: доступ к админке есть у того, у кого есть
# права на репозиторий. Ничего поверх не добавляем.
backend:
  name: gitlab
  # TODO: заменить на путь репозитория на GitLab (namespace/project)
  repo: fareeditor/portfolio
  branch: main
  auth_type: pkce
  # TODO: Application ID из GitLab → User Settings → Applications
  # (scope: api, redirect URI: https://fareeditor.com/admin/)
  app_id: c1622c7072c9fba7e098a9b954a8666b525943683af3df6cb830d44d1ea2d2e5

site_url: https://fareeditor.com

# Пути от корня репозитория — CMS коммитит в монорепо
media_folder: site/public/media/works
public_folder: /media/works

# Превью-пейн отключён намеренно: он потребовал бы вторую копию компонентов
# сайта и неизбежно разошёлся бы с реальным рендером.
editor:
  preview: false

collections:
  - name: content
    label: Тексты сайта
    files:
      - name: ru
        label: Русская версия
        file: site/src/data/content/ru.json
        fields:
          - { label: CTA в шапке, name: cta, widget: string }
          - { label: Подпись кнопки меню, name: menu, widget: string, hint: "Доступная подпись кнопки мобильного меню. Видна скринридеру, на экране кнопка показана значком." }
          - label: Навигация
            name: nav
            widget: list
            allow_add: false
            min: 4
            max: 4
            field: { label: Пункт, name: label, widget: string }
          - label: Первый экран
            name: hero
            widget: object
            fields:
              - { label: Заголовок, name: title, widget: string }
              - { label: Подзаголовок, name: sub, widget: text }
              - { label: Основная кнопка, name: primary, widget: string }
              - { label: Кнопка шоурила, name: secondary, widget: string }
          - label: Показатели
            name: stats
            widget: object
            fields:
              - { label: Сферы работы, name: industries, widget: string, hint: "Строка под сеткой показателей — общая подпись ко всем четырём цифрам. Сами цифры и их подписи живут в коллекции «Показатели»." }
          - label: Отзывы
            name: testimonials
            widget: object
            fields:
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
          - label: Работы
            name: work
            widget: object
            fields:
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Заголовок моушн-фрагментов, name: motionTitle, widget: string }
              - { label: Ссылка на YouTube, name: watch, widget: string }
              - { label: Показать все, name: showAll, widget: string }
              - { label: Подпись Play, name: play, widget: string }
              - { label: Заглушка превью, name: thumb, widget: string }
          - label: Процесс
            name: process
            widget: object
            fields:
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - label: Этапы
                name: steps
                widget: list
                allow_add: false
                min: 3
                max: 3
                summary: "{{fields.tc}} · {{fields.title}}"
                fields:
                  - { label: Таймкод, name: tc, widget: string }
                  - { label: Заголовок, name: title, widget: string }
                  - { label: Текст, name: body, widget: text }
          - label: Почему я
            name: why
            widget: object
            fields:
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - label: Преимущества
                name: items
                widget: list
                allow_add: false
                min: 4
                max: 4
                summary: "{{fields.title}}"
                fields:
                  - { label: Заголовок, name: title, widget: string }
                  - { label: Текст, name: body, widget: text }
          - label: FAQ
            name: faq
            widget: object
            fields:
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - label: Вопросы
                name: items
                widget: list
                allow_add: false
                min: 6
                max: 6
                summary: "{{fields.q}}"
                fields:
                  - { label: Вопрос, name: q, widget: string }
                  - { label: Ответ, name: a, widget: text }
          - label: Контактная форма
            name: contact
            widget: object
            fields:
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Вводный текст, name: text, widget: text }
              - label: Подписи полей
                name: labels
                widget: object
                fields:
                  - { label: Имя, name: name, widget: string }
                  - { label: Контакт, name: contact, widget: string }
                  - { label: Тип проекта, name: project_type, widget: string }
                  - { label: Бюджет, name: budget, widget: string }
                  - { label: Описание, name: message, widget: string }
              - { label: Подсказка контакта, name: hint, widget: string }
              - { label: Выберите, name: choose, widget: string }
              - { label: Обязательное поле, name: required, widget: string }
              - { label: Кнопка отправки, name: button, widget: string }
              - { label: Отправка, name: sending, widget: string }
              - { label: Успешная отправка, name: success, widget: text }
              - { label: Ошибка отправки, name: error, widget: text }
              - { label: Уведомление о данных, name: micro, widget: text }
              - label: Типы проектов
                name: project_type
                widget: list
                allow_add: false
                min: 4
                max: 4
                summary: "{{fields.label}}"
                fields:
                  - { label: Системный ключ, name: value, widget: string, hint: Не менять — ключ проверяется Worker. }
                  - { label: Подпись, name: label, widget: string }
              - label: Диапазоны бюджета
                name: budget
                widget: list
                allow_add: false
                min: 4
                max: 4
                summary: "{{fields.label}}"
                fields:
                  - { label: Системный ключ, name: value, widget: string, hint: Не менять — ключ проверяется Worker. }
                  - { label: Подпись, name: label, widget: string }
          - label: Подвал
            name: footer
            widget: object
            fields:
              - { label: Copyright, name: copy, widget: string }
              - label: Ссылки
                name: links
                widget: list
                allow_add: false
                min: 3
                max: 3
                summary: "{{fields.label}}"
                fields:
                  - { label: Подпись, name: label, widget: string }
                  - { label: URL, name: href, widget: string }

      - name: en
        label: English version
        file: site/src/data/content/en.json
        fields:
          - { label: Header CTA, name: cta, widget: string }
          - { label: Menu button label, name: menu, widget: string, hint: "Accessible label for the mobile menu button. Read by screen readers; on screen the button shows an icon." }
          - label: Navigation
            name: nav
            widget: list
            allow_add: false
            min: 4
            max: 4
            field: { label: Item, name: label, widget: string }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: sub, widget: text }
              - { label: Primary button, name: primary, widget: string }
              - { label: Showreel button, name: secondary, widget: string }
          - label: Stats
            name: stats
            widget: object
            fields:
              - { label: Industries, name: industries, widget: string, hint: "Line under the stats grid — one caption for all four figures. The figures themselves live in the «Показатели» collection." }
          - label: Testimonials
            name: testimonials
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
          - label: Work
            name: work
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Motion section title, name: motionTitle, widget: string }
              - { label: YouTube link, name: watch, widget: string }
              - { label: Show all, name: showAll, widget: string }
              - { label: Play label, name: play, widget: string }
              - { label: Thumbnail fallback, name: thumb, widget: string }
          - label: Process
            name: process
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - label: Steps
                name: steps
                widget: list
                allow_add: false
                min: 3
                max: 3
                summary: "{{fields.tc}} · {{fields.title}}"
                fields:
                  - { label: Timecode, name: tc, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: body, widget: text }
          - label: Why me
            name: why
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - label: Benefits
                name: items
                widget: list
                allow_add: false
                min: 4
                max: 4
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: body, widget: text }
          - label: FAQ
            name: faq
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - label: Questions
                name: items
                widget: list
                allow_add: false
                min: 6
                max: 6
                summary: "{{fields.q}}"
                fields:
                  - { label: Question, name: q, widget: string }
                  - { label: Answer, name: a, widget: text }
          - label: Contact form
            name: contact
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Intro text, name: text, widget: text }
              - label: Field labels
                name: labels
                widget: object
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Contact, name: contact, widget: string }
                  - { label: Project type, name: project_type, widget: string }
                  - { label: Budget, name: budget, widget: string }
                  - { label: Description, name: message, widget: string }
              - { label: Contact hint, name: hint, widget: string }
              - { label: Select placeholder, name: choose, widget: string }
              - { label: Required field, name: required, widget: string }
              - { label: Submit button, name: button, widget: string }
              - { label: Sending state, name: sending, widget: string }
              - { label: Success message, name: success, widget: text }
              - { label: Error message, name: error, widget: text }
              - { label: Data notice, name: micro, widget: text }
              - label: Project types
                name: project_type
                widget: list
                allow_add: false
                min: 4
                max: 4
                summary: "{{fields.label}}"
                fields:
                  - { label: System key, name: value, widget: string, hint: Do not change. The key is validated by the Worker. }
                  - { label: Label, name: label, widget: string }
              - label: Budget ranges
                name: budget
                widget: list
                allow_add: false
                min: 4
                max: 4
                summary: "{{fields.label}}"
                fields:
                  - { label: System key, name: value, widget: string, hint: Do not change. The key is validated by the Worker. }
                  - { label: Label, name: label, widget: string }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Copyright, name: copy, widget: string }
              - label: Links
                name: links
                widget: list
                allow_add: false
                min: 3
                max: 3
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: href, widget: string }

  - name: stats
    label: Показатели
    files:
      - name: stats
        label: Цифры о себе
        file: site/src/data/stats.json
        fields:
          - label: Показатели
            name: items
            widget: list
            allow_add: false
            min: 4
            max: 4
            summary: "{{fields.value}} · {{fields.label_ru}}"
            hint: "Четыре плашки в один ряд под первым экраном. Количество фиксировано — порядок меняется перетаскиванием."
            fields:
              - label: Значение (RU)
                name: value
                widget: string
                hint: "Короткая форма, например «100+» или «24ч». Обновляется вручную по мере роста практики."
              - label: Значение (EN)
                name: value_en
                widget: string
                hint: "То же для английской версии, например «100+» или «24h»."
              - label: Подпись (RU)
                name: label_ru
                widget: string
                hint: "1–2 слова под цифрой: что именно она считает."
              - label: Подпись (EN)
                name: label_en
                widget: string
                hint: "То же для английской версии. Не перевод — своя формулировка."

  - name: contacts
    label: Карточки контактов
    files:
      - name: contacts
        label: Каналы связи
        file: site/src/data/contacts.json
        fields:
          - label: Карточки
            name: items
            widget: list
            allow_add: false
            min: 4
            max: 4
            summary: "{{fields.kind}} · {{fields.value}}"
            hint: "Четыре карточки под формой. Количество фиксировано раскладкой — порядок меняется перетаскиванием."
            fields:
              - label: Тип карточки
                name: kind
                widget: select
                options: ["email", "location", "telegram", "twitter"]
                hint: "Определяет иконку и поведение: email открывает почту, location ничего не открывает, telegram и twitter ведут по ссылкам из «Настройки сайта». Не менять без правки кода."
              - label: Ярлык (RU)
                name: label_ru
                widget: string
                hint: "Подпись над значением, одно слово."
              - label: Ярлык (EN)
                name: label_en
                widget: string
                hint: "То же для английской версии."
              - label: Значение (RU)
                name: value
                widget: string
                hint: "То, что видно на карточке: адрес почты, город, имя аккаунта."
              - label: Значение (EN)
                name: value_en
                widget: string
                hint: "То же для английской версии."
              - label: Тема письма (RU)
                name: subject_ru
                widget: string
                required: false
                hint: "Только для карточки email: подставляется в тему письма. У остальных карточек оставить пустым."
              - label: Тема письма (EN)
                name: subject_en
                widget: string
                required: false
                hint: "То же для английской версии — по теме письма видно, с какой локали пришёл контакт."

  - name: categories
    label: Категории работ
    label_singular: Категория
    folder: site/src/data/categories
    format: json
    extension: json
    create: true
    identifier_field: slug
    slug: "{{fields.slug}}"
    summary: "{{order}} · {{title_ru}}"
    sortable_fields: ["order"]
    fields:
      - label: Slug
        name: slug
        widget: string
        hint: "Имя файла и постоянный ключ категории — на него ссылаются работы. Только строчные латинские буквы, цифры и дефис. После публикации не менять."
        pattern: ["^[a-z0-9-]+$", "Только строчные латинские буквы, цифры и дефис"]
      - label: Опубликовано
        name: published
        widget: boolean
        default: true
        hint: "Снимите, чтобы убрать блок категории с сайта. Блок без опубликованных работ не показывается в любом случае."
      - label: Порядок
        name: order
        widget: number
        value_type: int
        hint: "Позиция блока в секции работ, сортировка по возрастанию."
      - label: Заголовок (RU)
        name: title_ru
        widget: string
        hint: "Заголовок блока для русской версии."
      - label: Заголовок (EN)
        name: title_en
        widget: string
        hint: "Заголовок блока для английской версии — самостоятельный текст, не перевод."
      - label: Подпись (RU)
        name: blurb_ru
        widget: string
        required: false
        hint: "Необязательная строка под заголовком для русской версии."
      - label: Подпись (EN)
        name: blurb_en
        widget: string
        required: false
        hint: "То же для английской версии. Не перевод — своя формулировка."
      - label: Пропорция превью
        name: aspect
        widget: select
        options: ["16:9", "9:12", "1:1", "4:5"]
        default: "16:9"
        hint: "Форма превью у всех работ этой категории. 16:9 — горизонтальное видео, 9:12 — вертикальное."

  - name: testimonials
    label: Отзывы
    label_singular: Отзыв
    folder: site/src/data/testimonials
    format: json
    extension: json
    create: true
    identifier_field: slug
    slug: "{{fields.slug}}"
    summary: "{{order}} · {{channel_name}}"
    sortable_fields: ["order"]
    fields:
      - label: Slug
        name: slug
        widget: string
        hint: "Имя файла и постоянный ключ записи. Только строчные латинские буквы, цифры и дефис. После публикации не менять."
        pattern: ["^[a-z0-9-]+$", "Только строчные латинские буквы, цифры и дефис"]
      - label: Опубликован
        name: published
        widget: boolean
        default: false
        hint: "Пока не опубликован ни один отзыв, секция на сайте не показывается вообще."
      - label: Порядок
        name: order
        widget: number
        value_type: int
        hint: "Позиция в ленте, сортировка по возрастанию."
      - label: Канал или клиент
        name: channel_name
        widget: string
        hint: "Имя собственное — одно значение на обе локали, не переводится."
      - label: Роль (RU)
        name: role_ru
        widget: string
        hint: "Кем автор приходится проекту, напр. «Владелец канала»."
      - label: Роль (EN)
        name: role_en
        widget: string
        hint: "То же для английской версии."
      - label: Текст отзыва (RU)
        name: quote_ru
        widget: text
        hint: "Отзыв для русской версии."
      - label: Текст отзыва (EN)
        name: quote_en
        widget: text
        hint: "Для английской версии — своя формулировка, не перевод русской."
      - label: Логотип
        name: logo
        widget: image
        required: false
        hint: "Квадратная картинка: на карточке обрезается в круг. Без неё карточка идёт без аватара."

  - name: works
    label: Работы
    label_singular: Работа
    folder: site/src/data/works
    format: json
    extension: json
    create: true
    identifier_field: slug
    slug: "{{fields.slug}}"
    summary: "{{order}} · {{client}} · {{title_ru}}"
    sortable_fields: ["order"]
    fields:
      - label: Slug
        name: slug
        widget: string
        hint: "Имя файла и постоянный ключ записи. Только строчные латинские буквы, цифры и дефис. После публикации не менять."
        pattern: ["^[a-z0-9-]+$", "Только строчные латинские буквы, цифры и дефис"]
      - label: Опубликовано
        name: published
        widget: boolean
        default: true
        hint: "Снимите, чтобы скрыть работу с сайта без удаления файла."
      - label: Категория
        name: category
        widget: relation
        collection: categories
        search_fields: ["slug", "title_ru", "title_en"]
        value_field: slug
        display_fields: ["title_ru"]
        hint: "Блок, в котором показывается работа. Пропорция превью берётся из категории."
      - label: Шире остальных
        name: featured
        widget: boolean
        default: false
        hint: "Карточка занимает всю ширину сетки внутри своего блока категории."
      - label: Порядок
        name: order
        widget: number
        value_type: int
        hint: "Позиция в списке, сортировка по возрастанию."
      - label: Клиент (RU)
        name: client
        widget: string
        hint: "Имя клиента или канала для русской версии."
      - label: Клиент (EN)
        name: client_en
        widget: string
        hint: "Для английской версии. Не перевод — своя формулировка (напр. «Real estate developer» вместо названия)."
      - label: Формат (RU)
        name: format
        widget: string
        hint: "Площадка/формат в мета-строке карточки, напр. «Корпоративный YouTube»."
      - label: Формат (EN)
        name: format_en
        widget: string
        hint: "То же для английской версии."
      - label: Хронометраж (RU)
        name: duration
        widget: string
        hint: "Напр. «9:30» или «фрагмент»."
      - label: Хронометраж (EN)
        name: duration_en
        widget: string
        hint: "Напр. «9:30» или «excerpt»."
      - label: Заголовок (RU)
        name: title_ru
        widget: string
        hint: "Заголовок карточки для русской версии."
      - label: Заголовок (EN)
        name: title_en
        widget: string
        hint: "Заголовок для английской версии — самостоятельный текст, не перевод."
      - label: Текст (RU)
        name: body_ru
        widget: text
        hint: "Описание кейса, 2–3 предложения: задача и что сделано."
      - label: Текст (EN)
        name: body_en
        widget: text
        hint: "То же для английской версии."
      - label: YouTube ID
        name: youtube_id
        widget: string
        hint: "11 символов из адреса ролика: youtube.com/watch?v=XXXXXXXXXXX."
        pattern: ["^[A-Za-z0-9_-]{11}$", "Ровно 11 символов: латинские буквы, цифры, дефис, подчёркивание"]
      - label: Превью
        name: thumbnail
        widget: image
        hint: "Статичное превью, webp. Для case — 16:9, для motion — 9:12. Плеер монтируется только по клику."

  - name: settings
    label: Настройки
    files:
      - name: site
        label: Настройки сайта
        file: site/src/data/settings.json
        fields:
          - label: Статус в шапке (RU)
            name: status
            widget: string
            hint: "Текст в пилюле статуса на первом экране, напр. «Открыт для проектов»."
          - label: Статус в шапке (EN)
            name: status_en
            widget: string
            hint: "То же для английской версии, напр. «Available for projects»."
          - label: Показывать кнопку шоурила
            name: showreel_enabled
            widget: boolean
            default: false
            hint: "Включает кнопку шоурила на первом экране. При выключенном переключателе кнопки нет."
          - label: Showreel ID
            name: showreel_id
            widget: string
            hint: "YouTube ID шоурила (11 символов). Используется, когда переключатель выше включён."
          - label: Контакт напрямую (RU)
            name: contact_url
            widget: string
            hint: "Ссылка «написать напрямую» для русской версии — Telegram. Этот же адрес открывает карточка Telegram в блоке контактов."
          - label: Контакт напрямую (EN)
            name: contact_url_en
            widget: string
            hint: "Для английской версии — X. Каналы у локалей разные намеренно, не синхронизировать. Этот же адрес открывает карточка Twitter в блоке контактов."
